[project]
name = "enterprise-rag-pipeline"
version = "0.1.0"
description = "RAG pipeline for querying enterprise clinical policy documents with Claude"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pypdf>=5.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.2.0,<2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
